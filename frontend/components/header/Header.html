<!-- Header Component -->
<!-- Theme Toggle Button -->
<button id="themeToggle" class="theme-toggle">☀️ Dark Mode</button>

<!-- Dashboard Header -->
<header class="dashboard-header">
    <div class="header-vertical">
        <button id="stockstreamNavBtn" style="background: none; border: none; cursor: pointer; padding: 0; margin: 0;">
            <h1 style="margin: 0; color: #22c55e; font-size: 20px;">StockStream</h1>
        </button>
        <div class="header-user-row">
            <div id="userDisplay">
                <!-- Name/Username injected here -->
            </div>
            <div class="profile-menu-container header-actions">
                <button id="friendNotificationBtn" class="notification-btn" onclick="showFriendRequestsModal()">
                    🔔
                    <span id="friendNotificationBadge" class="notification-badge" style="display: none;">0</span>
                </button>
                <button id="profileCircle" class="profile-button" onclick="toggleProfileDropdown();">👤</button>
                <div id="profileDropdown" class="profile-dropdown">
                    <button id="openProfilePage" class="dropdown-item">Profile</button>
                    <button id="doLogout" class="dropdown-item">Logout</button>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Top Navigation Tabs -->
<div class="top-rows">
    <div class="top-row-item" data-row="dashboards" id="dashboardsBtn">Dashboards</div>
    <div class="top-row-item" data-row="your tasks" id="yourTasksBtn">Your Tasks</div>
    <div class="top-row-item" data-row="credits" id="creditsBtn">Credits</div>
    <div class="top-row-item" data-row="view others" id="viewOthersBtn">View Others</div>
    <div class="top-row-item" data-row="view profile" id="viewProfileBtn">View Profile</div>
</div>
