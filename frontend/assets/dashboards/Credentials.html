<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockStream - Credentials</title>
    <link rel="stylesheet" href="../components/header-styles.css">
    <link rel="stylesheet" href="./css/credentials.css">
    <style>
        .developers-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            align-items: stretch;
            margin: 20px 0;
        }

        .developer-card {
            background-color: var(--bg-primary, #fff);
            border: 1px solid var(--border-color, #e6e6e6);
            border-radius: 8px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: all 0.2s ease;
            color: var(--text-primary, #111);
        }

        .developer-card:hover { transform: translateY(-4px); box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
        .developer-avatar { font-size: 44px; margin-bottom: 12px; }
        .developer-name { font-weight:700; margin-bottom:6px; }
        .developer-role { color: var(--accent-green, #22c55e); font-weight:600; margin-bottom:8px; }
    </style>
</head>
<body>
    <!-- Header Container -->
    <div id="headerContainer"></div>

    <!-- Page Content -->
    <div class="page-content">
        <h1 class="page-title">Credits</h1>

        <div class="developers-container">
            <div class="developer-card">
                <div class="developer-avatar">👨‍💻</div>
                <div class="developer-name">Developer 1</div>
                <div class="developer-role">Full Stack Developer</div>
            </div>

            <div class="developer-card">
                <div class="developer-avatar">👩‍🎨</div>
                <div class="developer-name">Developer 2</div>
                <div class="developer-role">Web Designer</div>
            </div>

            <div class="developer-card">
                <div class="developer-avatar">🖥️</div>
                <div class="developer-name">Developer 3</div>
                <div class="developer-role">System Developer</div>
            </div>

            <div class="developer-card">
                <div class="developer-avatar">⚙️</div>
                <div class="developer-name">Developer 4</div>
                <div class="developer-role">Backend Developer</div>
            </div>
        </div>

        <footer style="margin-top:30px;text-align:center;color:var(--text-secondary,#444);">
            <p>Thank you to the developers for creating StockStream as an economic-based system.</p>
        </footer>
    </div>

    <!-- Load header component -->
    <script src="../components/header-script.js"></script>
    <script src="./js/credentials.js"></script>
</body>
</html>
