<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockStream - Login & Register</title>
    <link rel="stylesheet" href="login.css">
    <script>
        // Check if user is already logged in - redirect to dashboard if so
        (function() {
            const userData = localStorage.getItem('userData');
            if (userData) {
                window.location.href = '../dashboards/Dashboard.html';
            }
        })();
    </script>
</head>
<body>
    <div class="brand-header" id="brandHeader">
        <h2>StockStream</h2>
    </div>

    <div class="login-container">
        <!-- Login Form -->
        <div class="form-wrapper login-form active" id="loginFormWrapper">
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <input 
                        type="email" 
                        id="loginEmail" 
                        name="email" 
                        placeholder="Email Address"
                        required
                    >
                </div>

                <div class="form-group">
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="loginPassword" 
                            name="password" 
                            placeholder="Password"
                            required
                        >
                        <button type="button" class="toggle-password" data-target="loginPassword">
                            <span class="eye-icon">👁️</span>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="rememberMe">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit">Login</button>

                <div class="form-divider">
                    <span>or</span>
                </div>

                <p class="form-toggle">
                    Don't have an account? 
                    <a href="#" id="toRegisterLink" class="toggle-link">Register</a>
                </p>
            </form>

            <div id="loginMessage" class="message-box"></div>
        </div>

        <!-- Registration Form -->
        <div class="form-wrapper registration-form" id="registerFormWrapper">
            <form id="registrationForm" class="auth-form">
                <div class="form-group">
                    <input 
                        type="email" 
                        id="registerEmail" 
                        name="email" 
                        placeholder="Email Address"
                        required
                    >
                </div>

                <div class="form-group">
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="registerPassword" 
                            name="password" 
                            placeholder="Password (min 8 characters)"
                            minlength="8"
                            required
                        >
                        <button type="button" class="toggle-password" data-target="registerPassword">
                            <span class="eye-icon">👁️</span>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="registerConfirmPassword" 
                            name="confirmPassword" 
                            placeholder="Confirm Password"
                            required
                        >
                        <button type="button" class="toggle-password" data-target="registerConfirmPassword">
                            <span class="eye-icon">👁️</span>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Create Account</button>

                <div class="form-divider">
                    <span>or</span>
                </div>

                <p class="form-toggle">
                    Already have an account? 
                    <a href="#" id="toLoginLink" class="toggle-link">Login</a>
                </p>
            </form>

            <div id="registerMessage" class="message-box"></div>
        </div>
    </div>

    <!-- Dashboard Panel -->
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h3>Registered Users <button class="dashboard-refresh-btn" title="Refresh users">🔄</button></h3>
        </div>
        <div class="dashboard-content">
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Users will be loaded here -->
                </tbody>
            </table>
        </div>
        <div class="dashboard-footer">
            Last updated: <span id="lastUpdated">Now</span>
        </div>
    </div>

    <script src="../../backend-callout.js"></script>
    <script src="../../API.js"></script>
    <script src="login.js"></script>
</body>
</html>
