<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="stylesheet" href="../header-styles.css">
    <link rel="stylesheet" href="accountsettings.css">
    <script>
        // Check authentication
        if (!localStorage.getItem('userData')) {
            window.location.href = '../../login/login.html';
        }
    </script>
    <style>
        /* Hide header components in account settings page */
        .dashboard-header {
            display: none;
        }
        
        .top-rows {
            display: none;
        }

        .page-content {
            margin-top: 0 !important;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div id="headerContainer"></div>

    <!-- Main Content -->
    <div class="page-content">
        <div class="account-settings-page">
            <!-- Back Button -->
            <a href="javascript:history.back()" class="back-link">← Back</a>

            <!-- Modal Container -->
            <div class="account-settings-modal">
                <!-- Modal 1: Main Options -->
                <div class="modal-content active" id="modal-1">
                    <div class="modal-header">
                        <h2>Account Settings</h2>
                    </div>
                    
                    <div class="modal-body">
                        <div class="settings-options">
                            <button class="settings-button" id="changeNameBtn">
                                <span class="button-icon">👤</span>
                                <span class="button-text">Change Name & Username</span>
                            </button>
                            
                            <button class="settings-button" id="changePasswordBtn">
                                <span class="button-icon">🔒</span>
                                <span class="button-text">Change Password</span>
                            </button>
                            
                            <button class="settings-button danger-button" id="deleteAccountBtn">
                                <span class="button-icon">🗑️</span>
                                <span class="button-text">Delete Account</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Modal 2: Change Name & Username -->
                <div class="modal-content" id="modal-2">
                    <div class="modal-header">
                        <button class="back-button" id="backFromNameBtn">← Back</button>
                        <h2>Update Profile</h2>
                    </div>
                    
                    <div class="modal-body">
                        <form id="nameForm" class="settings-form">
                            <div class="form-group">
                                <label for="nameInput">Name</label>
                                <input 
                                    type="text" 
                                    id="nameInput" 
                                    name="name" 
                                    placeholder="Enter your full name"
                                    maxlength="30"
                                >
                                <span class="char-count"><span id="nameCount">0</span>/30</span>
                            </div>

                            <div class="form-group">
                                <label for="usernameInput">Username</label>
                                <input 
                                    type="text" 
                                    id="usernameInput" 
                                    name="username" 
                                    placeholder="Enter your username"
                                    maxlength="10"
                                >
                                <span class="char-count"><span id="usernameCount">0</span>/10</span>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn-save">Save Changes</button>
                                <button type="reset" class="btn-cancel">Cancel</button>
                            </div>
                        </form>
                        <div id="nameMessage" class="message-box"></div>
                    </div>
                </div>

                <!-- Modal 3: Change Password -->
                <div class="modal-content" id="modal-3">
                    <div class="modal-header">
                        <button class="back-button" id="backFromPasswordBtn">← Back</button>
                        <h2>Change Password</h2>
                    </div>
                    
                    <div class="modal-body">
                        <form id="passwordForm" class="settings-form">
                            <div class="form-group">
                                <label for="oldPassword">Current Password</label>
                                <div class="password-input-wrapper">
                                    <input 
                                        type="password" 
                                        id="oldPassword" 
                                        name="oldPassword" 
                                        placeholder="Enter your current password"
                                        required
                                    >
                                    <button type="button" class="toggle-password-btn" data-target="oldPassword">👁️</button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="newPassword">New Password</label>
                                <div class="password-input-wrapper">
                                    <input 
                                        type="password" 
                                        id="newPassword" 
                                        name="newPassword" 
                                        placeholder="Enter new password (min 8 characters)"
                                        minlength="8"
                                        required
                                    >
                                    <button type="button" class="toggle-password-btn" data-target="newPassword">👁️</button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="confirmPassword">Confirm New Password</label>
                                <div class="password-input-wrapper">
                                    <input 
                                        type="password" 
                                        id="confirmPassword" 
                                        name="confirmPassword" 
                                        placeholder="Confirm your new password"
                                        required
                                    >
                                    <button type="button" class="toggle-password-btn" data-target="confirmPassword">👁️</button>
                                </div>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn-save">Change Password</button>
                                <button type="reset" class="btn-cancel">Cancel</button>
                            </div>
                        </form>
                        <div id="passwordMessage" class="message-box"></div>
                    </div>
                </div>

                <!-- Modal 4: Delete Account -->
                <div class="modal-content" id="modal-4">
                    <div class="modal-header">
                        <button class="back-button" id="backFromDeleteBtn">← Back</button>
                        <h2 class="danger-title">Delete Account</h2>
                    </div>
                    
                    <div class="modal-body">
                        <div class="delete-warning">
                            <p class="warning-text">⚠️ <strong>Warning:</strong> This action cannot be undone!</p>
                            <p>Deleting your account will also:</p>
                            <ul class="delete-consequences">
                                <li>Remove all tasks you created</li>
                                <li>Remove all tasks you completed</li>
                                <li>Remove all your friend connections</li>
                            </ul>
                        </div>
                        
                        <form id="deleteAccountForm" class="settings-form">
                            <div class="form-group">
                                <label for="deletePassword">Enter your password to confirm</label>
                                <div class="password-input-wrapper">
                                    <input 
                                        type="password" 
                                        id="deletePassword" 
                                        name="deletePassword" 
                                        placeholder="Enter your password"
                                        required
                                    >
                                    <button type="button" class="toggle-password-btn" data-target="deletePassword">👁️</button>
                                </div>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn-delete">Delete My Account</button>
                            </div>
                        </form>
                        <div id="deleteMessage" class="message-box"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load header component -->
    <script src="../header-script.js"></script>
    <script src="accountsettings.js"></script>
    <script>
        // Initialize header with auth check
        const headerContainer = document.getElementById('headerContainer');
        fetch('../header.html')
            .then(response => response.text())
            .then(html => {
                headerContainer.innerHTML = html;
                initializeHeader('credentials');
            })
            .catch(error => console.error('Error loading header:', error));
    </script>
</body>
</html>
